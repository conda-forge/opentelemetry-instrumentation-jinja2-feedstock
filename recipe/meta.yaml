{% set name = "opentelemetry-instrumentation-jinja2" %}
{% set version = "0.66b0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_jinja2-{{ version }}.tar.gz
  sha256: d7171405c2cb3875edf9c2dc5db06176a94e3b3ee1cf7e5e1997c8ca21c8c0d1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.66b0
    - wrapt <3.0.0,>=1.0.0
